<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Again Studios</title>
<meta name="description" content="Night Again Studios makes Emo Emu, a falling-piece game for iPhone.">
<style>
  :root { --bg: #0a0c12; --ink: #f2efe6; --dim: #9aa0b4; --accent: #7c9cd6; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; text-align: center; }
  img { width: min(320px, 70vw); height: auto; display: block; margin: 0 auto 24px; }
  h1 { font-size: 1.6rem; letter-spacing: 0.04em; margin: 0 0 8px; }
  p { color: var(--dim); margin: 0 0 20px; }
  nav a { color: var(--accent); text-decoration: none; margin: 0 12px; }
  nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <img src="/assets/night-again-studios.png" alt="Night Again Studios">
  <h1>Night Again Studios</h1>
  <p>We make Emo Emu, a falling-piece game for iPhone.</p>
  <nav>
    <a href="/emoemu/privacy">Privacy</a>
    <a href="/emoemu/support">Support</a>
  </nav>
</main>
</body>
</html>
