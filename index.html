<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Again Studios</title>
<meta name="description" content="Night Again Studios makes games after dark. Emo Emu — drop buddies, bounce bullies — is coming to iPhone.">
<meta property="og:title" content="Night Again Studios">
<meta property="og:description" content="Made after dark.">
<meta property="og:image" content="https://nightagainstudios.com/assets/night-again-studios.png">
<link rel="icon" href="/assets/emo-emu-icon.png" type="image/png">
<style>
  @font-face {
    font-family: "Michroma";
    src: url("/assets/fonts/Michroma-Regular.ttf") format("truetype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #0a0c12;          /* the logo's own ground, sampled */
    --ink: #f2efe6;
    --dim: #8f96ad;
    --faint: #3a4056;
    --accent: #8fb0e8;      /* the logo's moonlit blue, lifted for text */
    --accent-deep: #2f4f9a;
    --panel: #10131c;
    --rim: rgba(143, 176, 232, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh; position: relative; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 56px 16px 72px; }

  header { text-align: center; padding-top: 8px; }
  header h1 { margin: 0; }
  /* The glow is the mark's own light, three layers deep:
     1. a wide, very faint pool of moonlight in the air behind it (::before),
     2. a blurred copy of the mark itself (.bloom) — so the letters glow cream and the
        doorway glows blue, the way a lit sign blooms, instead of one flat halo colour,
     3. a tight edge light on the mark so it stays crisp against its own bloom. */
  .mark { position: relative; display: block; width: min(360px, 78vw); margin: 0 auto; isolation: isolate; }
  .mark::before {
    content: ""; position: absolute; left: 50%; top: 46%; width: 150%; height: 110%;
    transform: translate(-50%, -50%); z-index: -2; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(79, 118, 206, 0.16), rgba(47, 79, 154, 0.05) 55%, rgba(47, 79, 154, 0) 100%);
  }
  .mark img { width: 100%; height: auto; display: block; }
  .mark .bloom {
    position: absolute; inset: 0; z-index: -1; pointer-events: none;
    filter: blur(var(--bloom-blur, 22px)) saturate(1.35) brightness(1.1);
    opacity: var(--bloom, 0.55); transform: scale(1.04);
  }
  .mark .face { position: relative; filter: drop-shadow(0 0 1px rgba(143, 176, 232, 0.35)) drop-shadow(0 0 14px rgba(79, 118, 206, 0.22)); }
  .tag {
    font-family: "Michroma", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(1.05rem, 3.6vw, 1.35rem);
    letter-spacing: 0.22em; text-transform: lowercase;
    color: var(--ink); margin: 8px 0 0; text-align: center;
    text-shadow: 0 0 24px rgba(143, 176, 232, 0.25);
  }
  .tag .dot { color: var(--accent); }

  section.games { margin-top: 88px; }
  .eyebrow {
    font-size: 0.78rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--dim);
    margin: 0 0 18px; text-align: center;
  }
  .card {
    display: grid; grid-template-columns: 96px 1fr; gap: 20px; align-items: start;
    background: var(--panel); border: 1px solid var(--rim); border-radius: 22px;
    padding: 22px; position: relative;
  }
  .card::before {
    content: ""; position: absolute; inset: -1px; border-radius: 23px; z-index: -1;
    background: radial-gradient(60% 80% at 50% 0%, rgba(47, 79, 154, 0.35), transparent 70%);
    filter: blur(18px);
  }
  .card img { width: 96px; height: 96px; border-radius: 22px; display: block; }
  .card h2 { margin: 2px 0 4px; font-size: 1.35rem; letter-spacing: 0.02em; }
  .card .sub { margin: 0 0 10px; color: var(--accent); font-weight: 600; letter-spacing: 0.01em; }
  .card p { margin: 0 0 12px; color: var(--dim); }
  .card .soon {
    display: inline-block; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink); border: 1px solid var(--rim); border-radius: 999px; padding: 6px 12px;
  }

  footer { margin-top: 96px; text-align: center; color: var(--dim); font-size: 0.92rem; }
  footer nav { margin-bottom: 14px; }
  footer a { color: var(--accent); text-decoration: none; margin: 0 10px; }
  footer a:hover, footer a:focus-visible { text-decoration: underline; outline: none; }
  footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  footer small { display: block; color: var(--faint); margin-top: 6px; }

  @media (max-width: 420px) {
    .card { grid-template-columns: 72px 1fr; gap: 14px; padding: 18px; }
    .card img { width: 72px; height: 72px; border-radius: 17px; }
    .card h2 { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) { #sky { display: none; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <header>
    <h1>
      <span class="mark">
        <img class="bloom" src="/assets/night-again-studios.png" alt="" aria-hidden="true" width="1024" height="1024">
        <img class="face" src="/assets/night-again-studios.png" alt="Night Again Studios" width="1024" height="1024">
      </span>
    </h1>
    <p class="tag">made after dark<span class="dot">.</span></p>
  </header>

  <section class="games" aria-labelledby="games-h">
    <p class="eyebrow" id="games-h">Games</p>
    <article class="card">
      <img src="/assets/emo-emu-icon.png" alt="" width="512" height="512">
      <div>
        <h2>Emo Emu</h2>
        <p class="sub">Drop buddies. Bounce bullies.</p>
        <p>An emo band plays the worst rooms in town. Drop pairs, match four of a colour, and clear the scowling faces out of the room.</p>
        <span class="soon">Coming to iPhone</span>
      </div>
    </article>
  </section>

  <footer>
    <nav aria-label="Legal">
      <a href="/emoemu/privacy">Privacy</a>
      <a href="/emoemu/support">Support</a>
    </nav>
    <small>&copy; 2026 Night Again LLC</small>
  </footer>
</main>
<script>
(function () {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c = document.getElementById("sky"), ctx = c.getContext("2d");
  var stars = [], W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() {
    W = c.width = Math.floor(innerWidth * dpr); H = c.height = Math.floor(innerHeight * dpr);
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    var n = Math.round((innerWidth * innerHeight) / 9000);
    stars = [];
    for (var i = 0; i < n; i++) stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: (0.4 + Math.random() * 1.1) * dpr,
      p: Math.random() * Math.PI * 2,          /* twinkle phase */
      s: 0.15 + Math.random() * 0.5,           /* twinkle speed */
      d: 0.02 + Math.random() * 0.05           /* drift, px per frame */
    });
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y -= s.d * dpr; if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; }
      var a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.s + s.p));
      ctx.globalAlpha = a; ctx.fillStyle = "#cfd9f3";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  addEventListener("resize", size, { passive: true });
  size(); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
